format = """$character$directory$git_metrics\
$hostname\
$shell\
$env_var\
$jobs\
$username"""

right_format = """
$cmd_duration\
$git_branch\
$git_commit\
$git_state\
$git_status\
${custom.jj_change}\
${custom.jj_desc}\
$php\
$python\
$ruby\
${custom.rails}\
$battery\
$time"""

continuation_prompt = '▶▶ '

[aws]
disabled = true

[character]
format = "$symbol "

[directory]
home_symbol = "🏠"
truncation_length = 3
use_os_path_sep = true
style = "italic blue"
format = '[$path]($style)[$read_only]($read_only_style) '
repo_root_style = 'bold blue'
repo_root_format = '[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) '

[gcloud]
disabled = true

[cmd_duration]
format = '[\[⏱ $duration\]]($style)'
style = '220 dimmed'

[jobs]
format = "[$symbol$number]($style) "
style = "white"
symbol = "[▶](blue italic)"

[localip]
ssh_only = true
format = " ◯[$localipv4](bold magenta)"
disabled = false

[time]
disabled = false
format = ' [⏱︎ $time]($style)'
use_12hr = false
utc_time_offset = "local"
style = "italic dimmed white"

[battery]
format = '\[[$symbol $percentage]($style)\]'
full_symbol = "🔋"
charging_symbol = "⚡️"
discharging_symbol = "🪫"
unknown_symbol = "❔"
empty_symbol = "⚠️"

[[battery.display]]
threshold = 20
style = "italic bold red"

[[battery.display]]
threshold = 60
style = "italic dimmed bright-cyan"

[[battery.display]]
threshold = 70
style = "italic dimmed yellow"

[git_branch]
format = '[$symbol$branch(:$remote_branch)]($style) '
style = "italic bright-blue"
truncation_symbol = "⋯"
truncation_length = 20
ignore_branches = ["main", "master"]
only_attached = true

[git_commit]
format = '\[[\($hash$tag\)]($style)\]'
disabled = true

[git_metrics]
format = '((\[[+$added]($added_style))|([-$deleted]($deleted_style)\])) '
added_style = 'italic dimmed green'
deleted_style = 'italic dimmed red'
only_nonzero_diffs = true
ignore_submodules = true
disabled = false

[git_state]
format = '\[[$state ($progress_current/$progress_total)]($style)\]'
cherry_pick = '[🍒 PICKING](bold red)'

[git_status]
format = '([\[$all_status$ahead_behind\]]($style))'
style = 'bold green'
conflicted = '🏳'
ahead = '🏎💨${count}(green)'
behind = '😰${count}(red)'
diverged = '😵⇡${ahead_count}⇣${behind_count}'
up_to_date = '✓(green)'
untracked = '🤷'
stashed = '📦'
modified = '✎'
staged = '[+](green)'
renamed = '👅'
deleted = '🗑'

[nodejs]
format = " [node](italic) [◫ ($version)](bold bright-green)"
version_format = "${raw}"
detect_files = ["package-lock.json", "yarn.lock"]
detect_folders = ["node_modules"]
detect_extensions = []

[php]
format = '\[[$symbol($version)]($style)\]'
style = '39 dimmed'

[ruby]
format = " [${symbol}${version}]($style)"
symbol = "◆ "
version_format = "${raw}"
style = "dimmed red"

[package]
format = " [pkg](italic dimmed) [$symbol$version]($style)"
version_format = "${raw}"
symbol = "◨ "
style = "dimmed yellow italic bold"

[nix_shell]
style = 'bold italic dimmed blue'
symbol = '✶'
format = '[$symbol nix⎪$state⎪]($style) [$name](italic dimmed white)'
impure_msg = '[⌽](bold dimmed red)'
pure_msg = '[⌾](bold dimmed green)'
unknown_msg = '[◌](bold dimmed yellow)'

[custom.rails]
command = "grep '^[[:space:]]*rails (' Gemfile.lock | grep -o '[0-9]\\+\\(\\.[0-9]\\+\\)\\{2,3\\}' | head -n 1"
detect_files = ['Gemfile.lock']
symbol = ""
style = "dimmed red"
format = '[ $symbol( v$output) ]($style)'

[custom.jj_change]
description = "The working copy of the repo in your current directory: workspaces (if relevant), change ID, bookmarks"
command     = ''' jj log --no-graph -r=@ -T='separate(" ", working_copies, change_id.shortest(), bookmarks,)' '''
when        = ''' test -n "$(jj status)" || exit 1 '''
format      = ' [$symbol ($output)]($style) '
symbol      = '🐦'
style       = 'bold purple'
ignore_timeout  = true

[custom.jj_desc]
description = "The description of your working copy, if set"
command     = ''' jj log --no-graph -r=@ -T="description" | awk 'NR==1 {if(length($0) > 25) {s = substr($0, 1, 25); sub(/[ \t\r\n]+$/, "", s); print s "…"} else {print $0}}' '''
when        = ''' test -n "$(jj status)" -a -n "$(jj log --no-graph -r=@ -T='description')" || exit 1 '''
format      = '$symbol [($output)]($style) '
symbol      = '|'
ignore_timeout  = true
